# Paramas for Nav2

# configuration of global costmap
global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_link
        robot_radius: 0.3
        resolution: 0.05
        track_unknown_space: false
        rolling_window: true
        width: 10
        height: 10
        # camadas ultilizadas
        plugins: ["obstacle_layer", "inflation_layer"]
        # static_layer:
        #   plugin: "nav2_costmap_2d::StaticLayer"
        #   # plugin to be loaded for that specific layer
        #   map_subscribe_transient_local: True # stes the Qos settingd for the map topic
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: pointcloud
          pointcloud:
            topic: /model/bluerov2/sonar3d/pointcloud
            max_obstacle_height: 2.0 # maximum height of the sensor reading to return to the occupancy grid
            clearing: True # whether the obstacle is to be removed from the costmap or not
            marking: True # whether the inserted obstacle is marked into the costmap or not
            data_type: "PointCloud2"
            # set the maximum and minimum range to mark obstacles
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.55 # The value of the radius to inflate around lethal obstacles
        always_send_full_costmap: True

# configuration of local costmap
local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frenquency: 1.0
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 10
        height: 10
        resolution: 0.05
        footprint: "[ [0.21, 0.195], [0.21, -0.195], [-0.21, -0.195], [-0.21, 0.195] ]"
        robot_radius: 0.22
        plugins: ["voxel_layer", "inflation_layer"]
        voxel_layer:
          plugin: "nav2_costmap_2d::VoxelLayer"
          enabled: True
          origin_z: 0.0
          Z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          observation_sources: pointcloud
          pointcloud:
            topic: /model/bluerov2/sonar3d/pointcloud
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "PointCloud2"
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        always_send_full_costamap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "model/bluerov2/odometry"
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0